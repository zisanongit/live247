name: Process All Videos to HLS

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and B2 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade b2

      - name: Show installed versions
        run: |
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "B2 CLI:"
          b2 version

      - name: Authorize Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          b2 account authorize "$B2_KEY_ID" "$B2_APPLICATION_KEY"

      - name: Find and process all videos
        env:
          B2_BUCKET: my-stream-run
        run: |
          set -e

          mkdir -p input

          echo "========================================"
          echo "Finding videos in B2"
          echo "========================================"

          # Supported video formats:
          # mp4, mkv, webm, mov, avi, wmv, m4v, mpeg, mpg, ts
          b2 ls --recursive "b2://$B2_BUCKET/" > b2_files.txt

          grep -Ei '\.(mp4|mkv|webm|mov|avi|wmv|m4v|mpeg|mpg|ts)$' b2_files.txt \
            | grep -v '^hls/' \
            | sed -E 's/^.*b2:\/\/[^/]+\///' \
            > video_list.txt || true

          echo ""
          echo "Videos found:"
          cat video_list.txt || true
          echo ""

          if [ ! -s video_list.txt ]; then
            echo "No supported video files found."
            exit 0
          fi

          VIDEO_INDEX=0

          while IFS= read -r B2_PATH; do

            [ -z "$B2_PATH" ] && continue

            VIDEO_INDEX=$((VIDEO_INDEX + 1))

            FILENAME="$(basename "$B2_PATH")"
            EXT="${FILENAME##*.}"
            NAME="${FILENAME%.*}"

            # Make a safe folder name.
            SAFE_NAME="$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')"

            # If filename becomes empty, use video number.
            if [ -z "$SAFE_NAME" ]; then
              SAFE_NAME="video${VIDEO_INDEX}"
            fi

            INPUT_FILE="input/${FILENAME}"
            OUTPUT_DIR="output/${SAFE_NAME}"

            echo ""
            echo "========================================"
            echo "Processing video #${VIDEO_INDEX}"
            echo "File: ${FILENAME}"
            echo "B2 path: ${B2_PATH}"
            echo "Output: ${OUTPUT_DIR}"
            echo "========================================"

            rm -rf "$OUTPUT_DIR"
            mkdir -p "$OUTPUT_DIR"

            echo ""
            echo "Downloading video..."

            b2 file download \
              "b2://$B2_BUCKET/$B2_PATH" \
              "$INPUT_FILE"

            echo ""
            echo "Video information:"

            ffprobe \
              -v error \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$INPUT_FILE"

            echo ""
            echo "Creating HLS..."

            ffmpeg \
              -y \
              -i "$INPUT_FILE" \
              -map 0:v:0 \
              -map 0:a? \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              -f hls \
              -hls_time 6 \
              -hls_list_size 0 \
              -hls_playlist_type vod \
              -hls_segment_filename "${OUTPUT_DIR}/segment_%05d.ts" \
              "${OUTPUT_DIR}/playlist.m3u8"

            echo ""
            echo "Generated HLS files:"
            ls -lh "$OUTPUT_DIR"

            echo ""
            echo "Playlist:"
            cat "${OUTPUT_DIR}/playlist.m3u8"

            echo ""
            echo "Removing local input file..."
            rm -f "$INPUT_FILE"

            echo ""
            echo "Uploading HLS to B2..."

            # Delete old HLS files for this video first.
            b2 rm --recursive \
              "b2://$B2_BUCKET/hls/$SAFE_NAME/" \
              || true

            # Upload new HLS files.
            b2 sync \
              --no-progress \
              "$OUTPUT_DIR/" \
              "b2://$B2_BUCKET/hls/$SAFE_NAME/"

            echo ""
            echo "Upload completed for ${FILENAME}"

          done < video_list.txt

          echo ""
          echo "========================================"
          echo "ALL VIDEOS PROCESSED"
          echo "Total videos: ${VIDEO_INDEX}"
          echo "========================================"

      - name: Verify HLS folders
        env:
          B2_BUCKET: my-stream-run
        run: |
          echo "========================================"
          echo "HLS files currently in B2"
          echo "========================================"

          b2 ls --recursive \
            "b2://$B2_BUCKET/hls/"

      - name: Finished
        run: |
          echo ""
          echo "========================================"
          echo "HLS PROCESSING COMPLETED"
          echo "========================================"
          echo ""
          echo "Every supported video was processed."
          echo ""
          echo "HLS folders:"
          echo "hls/<video-name>/playlist.m3u8"
          echo ""
          echo "Segments:"
          echo "hls/<video-name>/segment_*.ts"
          echo ""
          echo "========================================"
