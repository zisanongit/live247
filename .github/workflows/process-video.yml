name: Process Videos to HLS

on:
  workflow_dispatch:

concurrency:
  group: live247-video-processing
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  process-videos:

    runs-on: ubuntu-latest

    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: my-stream-run
      B2_REGION: us-east-005

      DATABASE_KEY: processed-videos.json

    steps:

      # ========================================================
      # 1. Checkout repository
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

      # ========================================================
      # 2. Install FFmpeg and jq
      # ========================================================

      - name: Install FFmpeg and jq

        run: |

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      # ========================================================
      # 3. Install AWS CLI
      # ========================================================

      - name: Install AWS CLI

        run: |

          python3 -m pip install --upgrade awscli

      # ========================================================
      # 4. Configure B2 credentials
      # ========================================================

      - name: Configure B2 credentials

        run: |

          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${B2_KEY_ID}
          aws_secret_access_key=${B2_APPLICATION_KEY}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${B2_REGION}
          EOF

      # ========================================================
      # 5. Download processing database from B2
      # ========================================================

      - name: Prepare processing database

        shell: bash

        run: |

          set -e

          echo "========================================"
          echo "PREPARING DATABASE"
          echo "========================================"

          if aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$DATABASE_KEY" \
            --endpoint-url "$B2_ENDPOINT" \
            >/dev/null 2>&1
          then

            echo "Existing database found."

            aws s3 cp \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              processed-videos.json \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

          else

            echo "No existing database."

            echo '{}' > processed-videos.json

          fi

          echo ""
          echo "Database:"
          cat processed-videos.json

      # ========================================================
      # 6. Scan and process videos
      # ========================================================

      - name: Scan and process videos

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p work

          echo ""
          echo "========================================"
          echo "SCANNING B2"
          echo "========================================"

          # ----------------------------------------------------
          # Get every object in B2
          # ----------------------------------------------------

          aws s3api list-objects-v2 \
            --bucket "$B2_BUCKET" \
            --endpoint-url "$B2_ENDPOINT" \
            --query 'Contents[].Key' \
            --output text |
            tr '\t' '\n' |
            sed '/^None$/d' |
            sed '/^$/d' \
            > b2-files.txt

          # ----------------------------------------------------
          # Supported video extensions
          #
          # 3GP and FLV intentionally excluded.
          # ----------------------------------------------------

          grep -Ei \
            '(^|/)[^/]+\.(mp4|mkv|mov|avi|webm|mpeg|mpg|m4v)$' \
            b2-files.txt \
            > video-list.txt || true

          if [ ! -s video-list.txt ]; then

            echo ""
            echo "No supported videos found."

            exit 0

          fi

          echo ""
          echo "Videos found:"
          cat video-list.txt

          # ====================================================
          # Process each video
          # ====================================================

          while IFS= read -r VIDEO_KEY; do

            [ -z "$VIDEO_KEY" ] && continue

            echo ""
            echo "========================================"
            echo "SOURCE VIDEO"
            echo "$VIDEO_KEY"
            echo "========================================"

            BASENAME="$(basename "$VIDEO_KEY")"

            NAME="${BASENAME%.*}"

            # --------------------------------------------------
            # Create unique folder based on complete source path
            #
            # Example:
            #
            # videos/video1.mkv
            # videos/archive/video1.mkv
            #
            # will not collide.
            # --------------------------------------------------

            SOURCE_ID="$(
              printf '%s' "$VIDEO_KEY" |
              sha256sum |
              awk '{print $1}' |
              cut -c1-12
            )"

            SAFE_NAME="$(
              echo "$NAME" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9._-]/_/g'
            )"

            HLS_FOLDER="${SAFE_NAME}-${SOURCE_ID}"

            HLS_PREFIX="hls/${HLS_FOLDER}"

            OUTPUT_DIR="work/hls/${HLS_FOLDER}"

            mkdir -p "$OUTPUT_DIR"

            echo ""
            echo "HLS folder:"
            echo "$HLS_PREFIX"

            # ==================================================
            # Get source object information
            # ==================================================

            OBJECT_INFO="$(
              aws s3api head-object \
                --bucket "$B2_BUCKET" \
                --key "$VIDEO_KEY" \
                --endpoint-url "$B2_ENDPOINT"
            )"

            SIZE="$(
              echo "$OBJECT_INFO" |
              jq -r '.ContentLength'
            )"

            ETAG="$(
              echo "$OBJECT_INFO" |
              jq -r '.ETag' |
              tr -d '"'
            )"

            echo ""
            echo "Size:"
            echo "$SIZE"

            echo ""
            echo "ETag:"
            echo "$ETAG"

            # ==================================================
            # Check processed database
            # ==================================================

            EXISTING_SIZE="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].size // empty' \
                processed-videos.json
            )"

            EXISTING_ETAG="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].etag // empty' \
                processed-videos.json
            )"

            EXISTING_HLS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].hls_folder // empty' \
                processed-videos.json
            )"

            EXISTING_STATUS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].status // empty' \
                processed-videos.json
            )"

            # ==================================================
            # Skip only completely processed videos
            # ==================================================

            if [ "$EXISTING_SIZE" = "$SIZE" ] && \
               [ "$EXISTING_ETAG" = "$ETAG" ] && \
               [ "$EXISTING_STATUS" = "completed" ] && \
               [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo ">>> ALREADY PROCESSED"
              echo "Skipping:"
              echo "$BASENAME"

              continue

            fi

            echo ""
            echo ">>> NEW OR CHANGED VIDEO"
            echo "Processing:"
            echo "$BASENAME"

            # ==================================================
            # Delete ONLY this video's old HLS
            # ==================================================

            if [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo "Removing old HLS:"
              echo "$EXISTING_HLS"

              aws s3 rm \
                "s3://${B2_BUCKET}/${EXISTING_HLS}/" \
                --recursive \
                --endpoint-url "$B2_ENDPOINT" \
                --only-show-errors || true

            fi

            # --------------------------------------------------
            # Also remove the current generated folder
            # --------------------------------------------------

            aws s3 rm \
              "s3://${B2_BUCKET}/${HLS_PREFIX}/" \
              --recursive \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors || true

            # --------------------------------------------------
            # Clean local directory
            # --------------------------------------------------

            rm -rf "$OUTPUT_DIR"

            mkdir -p "$OUTPUT_DIR"

            # ==================================================
            # Download source video
            # ==================================================

            LOCAL_VIDEO="work/$(basename "$VIDEO_KEY")"

            rm -f "$LOCAL_VIDEO"

            echo ""
            echo "========================================"
            echo "DOWNLOADING SOURCE"
            echo "========================================"

            aws s3 cp \
              "s3://${B2_BUCKET}/${VIDEO_KEY}" \
              "$LOCAL_VIDEO" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""
            echo "Download completed."

            # ==================================================
            # Calculate SHA256
            # ==================================================

            HASH="$(
              sha256sum "$LOCAL_VIDEO" |
              awk '{print $1}'
            )"

            echo ""
            echo "SHA256:"
            echo "$HASH"

            # ==================================================
            # Convert to HLS
            # ==================================================

            echo ""
            echo "========================================"
            echo "HLS CONVERSION"
            echo "========================================"

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -i "$LOCAL_VIDEO" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -f hls \
              -hls_time 6 \
              -hls_playlist_type vod \
              -hls_flags independent_segments \
              -hls_segment_filename \
                "$OUTPUT_DIR/segment_%05d.ts" \
              "$OUTPUT_DIR/playlist.m3u8"

            echo ""
            echo "HLS conversion completed."

            # ==================================================
            # Verify output
            # ==================================================

            if [ ! -f "$OUTPUT_DIR/playlist.m3u8" ]; then

              echo ""
              echo "ERROR:"
              echo "playlist.m3u8 was not created."

              exit 1

            fi

            SEGMENT_COUNT="$(
              find "$OUTPUT_DIR" \
                -type f \
                -name "*.ts" |
              wc -l
            )"

            if [ "$SEGMENT_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR:"
              echo "No HLS segments were generated."

              exit 1

            fi

            echo ""
            echo "HLS segments:"
            echo "$SEGMENT_COUNT"

            # ==================================================
            # Upload HLS
            # ==================================================

            echo ""
            echo "========================================"
            echo "UPLOADING HLS TO B2"
            echo "========================================"

            aws s3 sync \
              "$OUTPUT_DIR/" \
              "s3://${B2_BUCKET}/${HLS_PREFIX}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""
            echo "HLS upload completed."

            # ==================================================
            # Update processing database
            # ==================================================

            TMP_JSON="$(mktemp)"

            jq \
              --arg key "$VIDEO_KEY" \
              --arg file "$BASENAME" \
              --arg hash "$HASH" \
              --arg size "$SIZE" \
              --arg etag "$ETAG" \
              --arg folder "$HLS_PREFIX" \
              --arg count "$SEGMENT_COUNT" \
              --arg processed "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '.[$key] = {
                filename: $file,
                source_key: $key,
                sha256: $hash,
                size: ($size | tonumber),
                etag: $etag,
                hls_folder: $folder,
                segment_count: ($count | tonumber),
                status: "completed",
                processed_at: $processed
              }' \
              processed-videos.json \
              > "$TMP_JSON"

            mv "$TMP_JSON" processed-videos.json

            # ==================================================
            # Save database immediately
            # ==================================================

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors

            echo ""
            echo "Processing database updated."

            # ==================================================
            # Cleanup local files
            # ==================================================

            rm -f "$LOCAL_VIDEO"

            rm -rf "$OUTPUT_DIR"

            echo ""
            echo "========================================"
            echo "VIDEO COMPLETED"
            echo "$BASENAME"
            echo "========================================"

          done < video-list.txt

      # ========================================================
      # 7. Cleanup orphan HLS folders
      #
      # If a source video was deleted from B2, its old HLS
      # remains unless we remove it.
      #
      # This section intentionally only removes HLS folders
      # recorded in the database whose source no longer exists.
      # ========================================================

      - name: Cleanup deleted video HLS

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "========================================"
          echo "CHECKING DELETED VIDEOS"
          echo "========================================"

          if [ ! -f processed-videos.json ]; then

            echo "No database."

            exit 0

          fi

          jq -r '
            to_entries[] |
            select(.value.hls_folder != null) |
            [.key, .value.hls_folder] |
            @tsv
          ' processed-videos.json |
          while IFS=$'\t' read -r SOURCE_KEY HLS_FOLDER; do

            if ! grep -Fxq "$SOURCE_KEY" b2-files.txt; then

              echo ""
              echo "Source video no longer exists:"
              echo "$SOURCE_KEY"

              echo "Removing HLS:"
              echo "$HLS_FOLDER"

              aws s3 rm \
                "s3://${B2_BUCKET}/${HLS_FOLDER}/" \
                --recursive \
                --endpoint-url "$B2_ENDPOINT" \
                --only-show-errors || true

              TMP_JSON="$(mktemp)"

              jq \
                --arg key "$SOURCE_KEY" \
                'del(.[$key])' \
                processed-videos.json \
                > "$TMP_JSON"

              mv "$TMP_JSON" processed-videos.json

            fi

          done

      # ========================================================
      # 8. Final database upload
      # ========================================================

      - name: Save final database

        shell: bash

        run: |

          set -e

          if [ -f processed-videos.json ]; then

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors

            echo ""
            echo "Final database saved."

          fi

      # ========================================================
      # 9. Finished
      # ========================================================

      - name: Finished

        run: |

          echo ""
          echo "========================================"
          echo "VIDEO PROCESSING FINISHED"
          echo "========================================"
          echo ""

          echo "Existing processed videos were skipped."

          echo "New or changed videos were converted."

          echo "Each video has its own HLS folder."

          echo "Old HLS is replaced only for the video"
          echo "being reprocessed."

          echo ""