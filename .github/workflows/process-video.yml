name: Process New B2 Videos to HLS

on:
  workflow_dispatch:

# Prevent multiple workflow runs from processing
# the B2 database at the same time.
concurrency:
  group: b2-video-processing
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  process-videos:

    runs-on: ubuntu-latest

    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: my-stream-run
      B2_REGION: us-east-005

      # Database stored inside B2
      DATABASE_KEY: processed-videos.json

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

      # =========================================================
      # 2. Install FFmpeg and jq
      # =========================================================

      - name: Install FFmpeg and jq

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg jq

      # =========================================================
      # 3. Install AWS CLI
      # =========================================================

      - name: Install AWS CLI

        run: |

          python3 -m pip install --upgrade awscli

      # =========================================================
      # 4. Configure B2 credentials
      # =========================================================

      - name: Configure B2 credentials

        run: |

          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${B2_KEY_ID}
          aws_secret_access_key=${B2_APPLICATION_KEY}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${B2_REGION}
          EOF

      # =========================================================
      # 5. Download processing database from B2
      # =========================================================

      - name: Prepare B2 processing database

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "PREPARING PROCESSING DATABASE"
          echo "=================================================="
          echo ""

          if aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$DATABASE_KEY" \
            --endpoint-url "$B2_ENDPOINT" \
            >/dev/null 2>&1
          then

            echo "Existing database found in B2."

            aws s3 cp \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              processed-videos.json \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

          else

            echo "No database found."

            echo "Creating new database."

            echo '{}' > processed-videos.json

          fi

          echo ""
          echo "Current database:"
          cat processed-videos.json
          echo ""

      # =========================================================
      # 6. Find and process videos
      # =========================================================

      - name: Find and process new videos

        shell: bash

        run: |

          set -euo pipefail

          WORK_DIR="work"

          mkdir -p "$WORK_DIR"

          echo ""
          echo "=================================================="
          echo "SCANNING BACKBLAZE B2"
          echo "=================================================="
          echo ""

          # -------------------------------------------------------
          # List all B2 objects
          # -------------------------------------------------------

          aws s3api list-objects-v2 \
            --bucket "$B2_BUCKET" \
            --endpoint-url "$B2_ENDPOINT" \
            --query 'Contents[].Key' \
            --output text |
            tr '\t' '\n' |
            sed '/^None$/d' |
            sed '/^$/d' \
            > b2-files.txt

          echo "B2 objects:"
          cat b2-files.txt || true

          echo ""

          # -------------------------------------------------------
          # Find supported video files
          #
          # Videos can be:
          # MP4
          # MKV
          # MOV
          # AVI
          # WEBM
          # MPEG
          # MPG
          # M4V
          #
          # 3GP and FLV intentionally excluded.
          # -------------------------------------------------------

          grep -Ei \
            '(^|/)[^/]+\.(mp4|mkv|mov|avi|webm|mpeg|mpg|m4v)$' \
            b2-files.txt \
            > video-list.txt || true

          if [ ! -s video-list.txt ]; then

            echo ""
            echo "No supported videos found in B2."

            exit 0

          fi

          echo ""
          echo "=================================================="
          echo "VIDEOS FOUND"
          echo "=================================================="
          echo ""

          cat video-list.txt

          echo ""

          # -------------------------------------------------------
          # Process every video
          # -------------------------------------------------------

          while IFS= read -r VIDEO_KEY; do

            [ -z "$VIDEO_KEY" ] && continue

            echo ""
            echo "=================================================="
            echo "VIDEO: $VIDEO_KEY"
            echo "=================================================="
            echo ""

            BASENAME="$(basename "$VIDEO_KEY")"

            NAME="${BASENAME%.*}"

            # -----------------------------------------------------
            # Create safe HLS folder name
            # -----------------------------------------------------

            SAFE_NAME="$(echo "$NAME" | \
              tr '[:upper:]' '[:lower:]' | \
              sed 's/[^a-z0-9._-]/_/g')"

            OUTPUT_DIR="hls/$SAFE_NAME"

            mkdir -p "$OUTPUT_DIR"

            # -----------------------------------------------------
            # Get current B2 metadata
            # -----------------------------------------------------

            echo "Checking B2 metadata..."

            OBJECT_INFO="$(
              aws s3api head-object \
                --bucket "$B2_BUCKET" \
                --key "$VIDEO_KEY" \
                --endpoint-url "$B2_ENDPOINT"
            )"

            SIZE="$(
              echo "$OBJECT_INFO" |
              jq -r '.ContentLength'
            )"

            ETAG="$(
              echo "$OBJECT_INFO" |
              jq -r '.ETag' |
              tr -d '"'
            )"

            echo ""
            echo "Filename : $BASENAME"
            echo "Size     : $SIZE bytes"
            echo "ETag     : $ETAG"
            echo ""

            # -----------------------------------------------------
            # Read database information
            # -----------------------------------------------------

            EXISTING_SIZE="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].size // empty' \
                processed-videos.json
            )"

            EXISTING_ETAG="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].etag // empty' \
                processed-videos.json
            )"

            EXISTING_HLS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].hls_folder // empty' \
                processed-videos.json
            )"

            # -----------------------------------------------------
            # Check if already processed
            # -----------------------------------------------------

            if [ "$EXISTING_SIZE" = "$SIZE" ] && \
               [ "$EXISTING_ETAG" = "$ETAG" ] && \
               [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo ">>> ALREADY PROCESSED"
              echo ""
              echo "Video : $BASENAME"
              echo "HLS   : $EXISTING_HLS"
              echo ""
              echo "Skipping download."
              echo "Skipping HLS conversion."
              echo ""

              continue

            fi

            # -----------------------------------------------------
            # New or changed video
            # -----------------------------------------------------

            echo ""
            echo ">>> NEW OR CHANGED VIDEO"
            echo ""
            echo "This video needs processing."
            echo ""

            LOCAL_VIDEO="$WORK_DIR/$BASENAME"

            rm -f "$LOCAL_VIDEO"

            # -----------------------------------------------------
            # Download ONLY this new/changed video
            # -----------------------------------------------------

            echo "Downloading from B2..."

            aws s3 cp \
              "s3://${B2_BUCKET}/${VIDEO_KEY}" \
              "$LOCAL_VIDEO" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""
            echo "Download completed."

            # -----------------------------------------------------
            # SHA-256
            # -----------------------------------------------------

            HASH="$(
              sha256sum "$LOCAL_VIDEO" |
              awk '{print $1}'
            )"

            echo ""
            echo "SHA256: $HASH"

            # -----------------------------------------------------
            # Clean ONLY this video's HLS folder
            #
            # Other videos remain untouched.
            # -----------------------------------------------------

            rm -f "$OUTPUT_DIR"/*.ts

            rm -f "$OUTPUT_DIR"/playlist.m3u8

            # -----------------------------------------------------
            # HLS conversion
            # -----------------------------------------------------

            echo ""
            echo "=================================================="
            echo "CONVERTING TO HLS"
            echo "=================================================="
            echo ""

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -i "$LOCAL_VIDEO" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -f hls \
              -hls_time 6 \
              -hls_playlist_type vod \
              -hls_flags independent_segments \
              -hls_segment_filename "$OUTPUT_DIR/segment_%05d.ts" \
              "$OUTPUT_DIR/playlist.m3u8"

            echo ""
            echo "HLS conversion completed."

            # -----------------------------------------------------
            # Verify playlist
            # -----------------------------------------------------

            if [ ! -f "$OUTPUT_DIR/playlist.m3u8" ]; then

              echo ""
              echo "ERROR:"
              echo "playlist.m3u8 was not created."

              exit 1

            fi

            # -----------------------------------------------------
            # Count segments
            # -----------------------------------------------------

            SEGMENT_COUNT="$(
              find "$OUTPUT_DIR" \
                -type f \
                -name "*.ts" |
              wc -l
            )"

            if [ "$SEGMENT_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR:"
              echo "No HLS segments were created."

              exit 1

            fi

            echo ""
            echo "HLS segments created: $SEGMENT_COUNT"

            # -----------------------------------------------------
            # Upload HLS to B2
            # -----------------------------------------------------

            echo ""
            echo "=================================================="
            echo "UPLOADING HLS TO B2"
            echo "=================================================="
            echo ""

            aws s3 sync \
              "$OUTPUT_DIR/" \
              "s3://${B2_BUCKET}/hls/${SAFE_NAME}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""
            echo "HLS upload completed."

            # -----------------------------------------------------
            # Update database
            # -----------------------------------------------------

            TMP_JSON="$(mktemp)"

            jq \
              --arg key "$VIDEO_KEY" \
              --arg file "$BASENAME" \
              --arg hash "$HASH" \
              --arg size "$SIZE" \
              --arg etag "$ETAG" \
              --arg folder "$SAFE_NAME" \
              --arg processed "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '.[$key] = {
                filename: $file,
                sha256: $hash,
                size: ($size | tonumber),
                etag: $etag,
                hls_folder: $folder,
                processed_at: $processed
              }' \
              processed-videos.json \
              > "$TMP_JSON"

            mv "$TMP_JSON" processed-videos.json

            # -----------------------------------------------------
            # Save database back to B2 immediately
            #
            # This is important:
            # If workflow processes 2 videos and then stops,
            # the first completed video is already recorded.
            # -----------------------------------------------------

            echo ""
            echo "Saving processing database to B2..."

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors

            echo ""
            echo "Processing database saved to B2."

            # -----------------------------------------------------
            # Remove temporary source video
            # -----------------------------------------------------

            rm -f "$LOCAL_VIDEO"

            echo ""
            echo "Temporary source video deleted."

            echo ""
            echo "=================================================="
            echo "VIDEO COMPLETED"
            echo "=================================================="
            echo ""
            echo "Video     : $BASENAME"
            echo "HLS       : hls/${SAFE_NAME}/"
            echo "Segments  : $SEGMENT_COUNT"
            echo ""

          done < video-list.txt

      # =========================================================
      # 7. Final database upload
      #
      # This also ensures the latest database is saved even
      # when no new video was processed.
      # =========================================================

      - name: Finalize B2 database

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "FINAL DATABASE SAVE"
          echo "=================================================="
          echo ""

          aws s3 cp \
            processed-videos.json \
            "s3://${B2_BUCKET}/${DATABASE_KEY}" \
            --endpoint-url "$B2_ENDPOINT" \
            --content-type "application/json" \
            --only-show-errors

          echo "Database successfully saved to B2."

          echo ""
          echo "Current database:"
          cat processed-videos.json

          echo ""

      # =========================================================
      # 8. Finished
      # =========================================================

      - name: Finished

        run: |

          echo ""
          echo "=================================================="
          echo "PROCESSING COMPLETED"
          echo "=================================================="
          echo ""

          echo "Previously processed videos were skipped."

          echo "New or changed videos were converted to HLS."

          echo "Processing database is stored in B2."

          echo ""

          echo "No GitHub database commit is required."

          echo ""