name: Process New Videos to HLS

on:
  workflow_dispatch:

concurrency:
  group: b2-video-processing
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  process-videos:

    runs-on: ubuntu-latest

    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: my-stream-run
      B2_REGION: us-east-005

      # Processing database stored in B2
      DATABASE_KEY: processed-videos.json

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

      # =========================================================
      # 2. Install FFmpeg + jq
      # =========================================================

      - name: Install FFmpeg and jq

        run: |

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      # =========================================================
      # 3. Install AWS CLI
      # =========================================================

      - name: Install AWS CLI

        run: |

          python3 -m pip install --upgrade awscli

      # =========================================================
      # 4. Configure B2
      # =========================================================

      - name: Configure B2 credentials

        run: |

          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${B2_KEY_ID}
          aws_secret_access_key=${B2_APPLICATION_KEY}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${B2_REGION}
          EOF

      # =========================================================
      # 5. Download processing database
      # =========================================================

      - name: Prepare processing database

        shell: bash

        run: |

          set -e

          echo "========================================"
          echo "PREPARING PROCESSING DATABASE"
          echo "========================================"

          if aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$DATABASE_KEY" \
            --endpoint-url "$B2_ENDPOINT" \
            >/dev/null 2>&1
          then

            echo "Existing database found."

            aws s3 cp \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              processed-videos.json \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

          else

            echo "No database found."

            echo '{}' > processed-videos.json

          fi

          echo ""
          echo "Current database:"
          cat processed-videos.json

      # =========================================================
      # 6. Scan and process videos
      # =========================================================

      - name: Process videos

        shell: bash

        run: |

          set -euo pipefail

          WORK_DIR="work"

          mkdir -p "$WORK_DIR"

          echo ""
          echo "========================================"
          echo "SCANNING B2 FOR VIDEOS"
          echo "========================================"

          # -----------------------------------------------------
          # Get all objects from B2
          # -----------------------------------------------------

          aws s3api list-objects-v2 \
            --bucket "$B2_BUCKET" \
            --endpoint-url "$B2_ENDPOINT" \
            --query 'Contents[].Key' \
            --output text |
            tr '\t' '\n' |
            sed '/^None$/d' |
            sed '/^$/d' \
            > b2-files.txt

          # -----------------------------------------------------
          # Find supported video formats
          #
          # 3GP and FLV intentionally excluded.
          # -----------------------------------------------------

          grep -Ei \
            '(^|/)[^/]+\.(mp4|mkv|mov|avi|webm|mpeg|mpg|m4v)$' \
            b2-files.txt \
            > video-list.txt || true

          if [ ! -s video-list.txt ]; then

            echo ""
            echo "No supported videos found."

            exit 0

          fi

          echo ""
          echo "Videos found:"
          cat video-list.txt

          # =====================================================
          # Process every video
          # =====================================================

          while IFS= read -r VIDEO_KEY; do

            [ -z "$VIDEO_KEY" ] && continue

            echo ""
            echo "========================================"
            echo "PROCESSING:"
            echo "$VIDEO_KEY"
            echo "========================================"

            BASENAME="$(basename "$VIDEO_KEY")"

            NAME="${BASENAME%.*}"

            # ---------------------------------------------------
            # Safe unique folder name
            # ---------------------------------------------------

            SAFE_NAME="$(echo "$NAME" | \
              tr '[:upper:]' '[:lower:]' | \
              sed 's/[^a-z0-9._-]/_/g')"

            HLS_PREFIX="hls/${SAFE_NAME}"

            OUTPUT_DIR="hls/${SAFE_NAME}"

            mkdir -p "$OUTPUT_DIR"

            # ---------------------------------------------------
            # Get source video information
            # ---------------------------------------------------

            OBJECT_INFO="$(
              aws s3api head-object \
                --bucket "$B2_BUCKET" \
                --key "$VIDEO_KEY" \
                --endpoint-url "$B2_ENDPOINT"
            )"

            SIZE="$(
              echo "$OBJECT_INFO" |
              jq -r '.ContentLength'
            )"

            ETAG="$(
              echo "$OBJECT_INFO" |
              jq -r '.ETag' |
              tr -d '"'
            )"

            echo ""
            echo "Filename : $BASENAME"
            echo "Size     : $SIZE"
            echo "ETag     : $ETAG"
            echo "HLS      : $HLS_PREFIX"

            # ---------------------------------------------------
            # Check processing database
            # ---------------------------------------------------

            EXISTING_SIZE="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].size // empty' \
                processed-videos.json
            )"

            EXISTING_ETAG="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].etag // empty' \
                processed-videos.json
            )"

            EXISTING_HLS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].hls_folder // empty' \
                processed-videos.json
            )"

            # ---------------------------------------------------
            # Already processed
            # ---------------------------------------------------

            if [ "$EXISTING_SIZE" = "$SIZE" ] && \
               [ "$EXISTING_ETAG" = "$ETAG" ] && \
               [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo ">>> ALREADY PROCESSED"
              echo "Skipping:"
              echo "$BASENAME"

              continue

            fi

            echo ""
            echo ">>> NEW OR CHANGED VIDEO"
            echo "Processing:"
            echo "$BASENAME"

            # ===================================================
            # IMPORTANT
            #
            # Delete ONLY this video's old HLS folder from B2.
            #
            # video1 does NOT affect video2/video3.
            # ===================================================

            echo ""
            echo "Removing old HLS for this video..."

            aws s3 rm \
              "s3://${B2_BUCKET}/${HLS_PREFIX}/" \
              --recursive \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors || true

            echo "Old HLS removed."

            # ---------------------------------------------------
            # Clean local output
            # ---------------------------------------------------

            rm -rf "$OUTPUT_DIR"

            mkdir -p "$OUTPUT_DIR"

            # ---------------------------------------------------
            # Temporary source path
            # ---------------------------------------------------

            LOCAL_VIDEO="$WORK_DIR/$BASENAME"

            rm -f "$LOCAL_VIDEO"

            # ===================================================
            # Download source video
            # ===================================================

            echo ""
            echo "Downloading source video..."

            aws s3 cp \
              "s3://${B2_BUCKET}/${VIDEO_KEY}" \
              "$LOCAL_VIDEO" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo "Download completed."

            # ===================================================
            # SHA256
            # ===================================================

            HASH="$(
              sha256sum "$LOCAL_VIDEO" |
              awk '{print $1}'
            )"

            echo ""
            echo "SHA256:"
            echo "$HASH"

            # ===================================================
            # HLS conversion
            # ===================================================

            echo ""
            echo "========================================"
            echo "HLS CONVERSION"
            echo "========================================"

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -i "$LOCAL_VIDEO" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -f hls \
              -hls_time 6 \
              -hls_playlist_type vod \
              -hls_flags independent_segments \
              -hls_segment_filename "$OUTPUT_DIR/segment_%05d.ts" \
              "$OUTPUT_DIR/playlist.m3u8"

            echo ""
            echo "HLS conversion completed."

            # ---------------------------------------------------
            # Verify playlist
            # ---------------------------------------------------

            if [ ! -f "$OUTPUT_DIR/playlist.m3u8" ]; then

              echo "ERROR: playlist.m3u8 not found."

              exit 1

            fi

            # ---------------------------------------------------
            # Count segments
            # ---------------------------------------------------

            SEGMENT_COUNT="$(
              find "$OUTPUT_DIR" \
                -type f \
                -name "*.ts" |
              wc -l
            )"

            if [ "$SEGMENT_COUNT" -eq 0 ]; then

              echo "ERROR: No HLS segments found."

              exit 1

            fi

            echo ""
            echo "Segments created:"
            echo "$SEGMENT_COUNT"

            # ===================================================
            # Upload ONLY this video's HLS folder
            # ===================================================

            echo ""
            echo "========================================"
            echo "UPLOADING HLS"
            echo "========================================"

            aws s3 sync \
              "$OUTPUT_DIR/" \
              "s3://${B2_BUCKET}/${HLS_PREFIX}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""
            echo "HLS upload completed."

            # ===================================================
            # Update database
            # ===================================================

            TMP_JSON="$(mktemp)"

            jq \
              --arg key "$VIDEO_KEY" \
              --arg file "$BASENAME" \
              --arg hash "$HASH" \
              --arg size "$SIZE" \
              --arg etag "$ETAG" \
              --arg folder "$HLS_PREFIX" \
              --arg processed "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '.[$key] = {
                filename: $file,
                sha256: $hash,
                size: ($size | tonumber),
                etag: $etag,
                hls_folder: $folder,
                processed_at: $processed
              }' \
              processed-videos.json \
              > "$TMP_JSON"

            mv "$TMP_JSON" processed-videos.json

            # ===================================================
            # Save database immediately
            # ===================================================

            echo ""
            echo "Saving database..."

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors

            echo "Database saved."

            # ===================================================
            # Delete temporary source
            # ===================================================

            rm -f "$LOCAL_VIDEO"

            # ---------------------------------------------------
            # Delete local HLS output to save runner disk space
            # ---------------------------------------------------

            rm -rf "$OUTPUT_DIR"

            echo ""
            echo "========================================"
            echo "COMPLETED:"
            echo "$BASENAME"
            echo "========================================"

          done < video-list.txt

      # =========================================================
      # 7. Final database save
      # =========================================================

      - name: Final database save

        shell: bash

        run: |

          set -e

          if [ -f processed-videos.json ]; then

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors

            echo "Final database saved successfully."

          fi

      # =========================================================
      # 8. Finished
      # =========================================================

      - name: Finished

        run: |

          echo ""
          echo "========================================"
          echo "ALL VIDEO PROCESSING FINISHED"
          echo "========================================"
          echo ""

          echo "Previously processed videos were skipped."

          echo "New videos were converted to separate HLS folders."

          echo "Each video's old HLS is replaced only when that"
          echo "specific video is reprocessed."

          echo ""