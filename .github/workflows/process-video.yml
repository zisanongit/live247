name: Process New B2 Videos to HLS

on:
  workflow_dispatch:

# Prevent two processing jobs from modifying
# processed-videos.json at the same time.
concurrency:
  group: b2-video-processing
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  process-videos:

    runs-on: ubuntu-latest

    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: my-stream-run
      B2_REGION: us-east-005

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      # =========================================================
      # 2. Install FFmpeg and jq
      # =========================================================

      - name: Install FFmpeg and jq

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg jq

      # =========================================================
      # 3. Install AWS CLI
      # =========================================================

      - name: Install AWS CLI

        run: |

          python3 -m pip install --upgrade awscli

      # =========================================================
      # 4. Configure Backblaze B2
      # =========================================================

      - name: Configure B2 credentials

        run: |

          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${B2_KEY_ID}
          aws_secret_access_key=${B2_APPLICATION_KEY}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${B2_REGION}
          EOF

      # =========================================================
      # 5. Prepare processed database
      # =========================================================

      - name: Prepare processed database

        run: |

          if [ ! -f processed-videos.json ]; then

            echo '{}' > processed-videos.json

          fi

          echo "Current processed database:"

          cat processed-videos.json

      # =========================================================
      # 6. Find and process videos from B2
      # =========================================================

      - name: Find and process new videos

        shell: bash

        run: |

          set -euo pipefail

          WORK_DIR="work"

          mkdir -p "$WORK_DIR"

          echo ""
          echo "=================================================="
          echo "LISTING B2 FILES"
          echo "=================================================="
          echo ""

          # -------------------------------------------------------
          # Get all B2 objects
          # -------------------------------------------------------

          aws s3api list-objects-v2 \
            --bucket "$B2_BUCKET" \
            --endpoint-url "$B2_ENDPOINT" \
            --query 'Contents[].Key' \
            --output text > b2-files.txt

          echo "Files found in B2:"

          cat b2-files.txt || true

          echo ""

          # -------------------------------------------------------
          # Find supported video files
          # -------------------------------------------------------

          grep -Ei \
            '(^|/)[^/]+\.(mp4|mkv|mov|avi|webm|mpeg|mpg|m4v)$' \
            b2-files.txt > video-list.txt || true

          if [ ! -s video-list.txt ]; then

            echo "No supported video files found."

            exit 0

          fi

          echo ""
          echo "=================================================="
          echo "VIDEOS FOUND"
          echo "=================================================="
          echo ""

          cat video-list.txt

          echo ""

          # -------------------------------------------------------
          # Process every video
          # -------------------------------------------------------

          while IFS= read -r VIDEO_KEY; do

            [ -z "$VIDEO_KEY" ] && continue

            echo ""
            echo "=================================================="
            echo "PROCESSING: $VIDEO_KEY"
            echo "=================================================="
            echo ""

            BASENAME="$(basename "$VIDEO_KEY")"

            NAME="${BASENAME%.*}"

            # -----------------------------------------------------
            # Create safe HLS folder name
            # -----------------------------------------------------

            SAFE_NAME="$(echo "$NAME" | \
              tr '[:upper:]' '[:lower:]' | \
              sed 's/[^a-z0-9._-]/_/g')"

            OUTPUT_DIR="hls/$SAFE_NAME"

            mkdir -p "$OUTPUT_DIR"

            # -----------------------------------------------------
            # Get B2 metadata
            # -----------------------------------------------------

            echo "Checking B2 metadata..."

            OBJECT_INFO="$(
              aws s3api head-object \
                --bucket "$B2_BUCKET" \
                --key "$VIDEO_KEY" \
                --endpoint-url "$B2_ENDPOINT"
            )"

            SIZE="$(
              echo "$OBJECT_INFO" |
              jq -r '.ContentLength'
            )"

            ETAG="$(
              echo "$OBJECT_INFO" |
              jq -r '.ETag' |
              tr -d '"'
            )"

            echo ""
            echo "Filename : $BASENAME"
            echo "Size     : $SIZE bytes"
            echo "ETag     : $ETAG"
            echo ""

            # -----------------------------------------------------
            # Check processed database
            # -----------------------------------------------------

            EXISTING_SIZE="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].size // empty' \
                processed-videos.json
            )"

            EXISTING_ETAG="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].etag // empty' \
                processed-videos.json
            )"

            EXISTING_HLS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].hls_folder // empty' \
                processed-videos.json
            )"

            # -----------------------------------------------------
            # Already processed
            # -----------------------------------------------------

            if [ "$EXISTING_SIZE" = "$SIZE" ] && \
               [ "$EXISTING_ETAG" = "$ETAG" ] && \
               [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo ">>> SKIPPING"
              echo "This video was already processed."
              echo "HLS folder: $EXISTING_HLS"
              echo ""

              continue

            fi

            # -----------------------------------------------------
            # New or changed video
            # -----------------------------------------------------

            echo ""
            echo ">>> NEW OR CHANGED VIDEO"
            echo "This video will be downloaded and converted."
            echo ""

            LOCAL_VIDEO="$WORK_DIR/$BASENAME"

            rm -f "$LOCAL_VIDEO"

            # -----------------------------------------------------
            # Download video from B2
            # -----------------------------------------------------

            echo "Downloading from B2..."

            aws s3 cp \
              "s3://${B2_BUCKET}/${VIDEO_KEY}" \
              "$LOCAL_VIDEO" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""

            echo "Download completed."

            # -----------------------------------------------------
            # Calculate SHA256
            # -----------------------------------------------------

            HASH="$(
              sha256sum "$LOCAL_VIDEO" |
              awk '{print $1}'
            )"

            echo ""

            echo "SHA256: $HASH"

            # -----------------------------------------------------
            # Clear ONLY this video's old HLS
            # -----------------------------------------------------

            rm -f "$OUTPUT_DIR"/*.ts

            rm -f "$OUTPUT_DIR"/playlist.m3u8

            # -----------------------------------------------------
            # Convert video to HLS
            # -----------------------------------------------------

            echo ""
            echo "=================================================="
            echo "HLS CONVERSION"
            echo "=================================================="
            echo ""

            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -i "$LOCAL_VIDEO" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -f hls \
              -hls_time 6 \
              -hls_playlist_type vod \
              -hls_flags independent_segments \
              -hls_segment_filename "$OUTPUT_DIR/segment_%05d.ts" \
              "$OUTPUT_DIR/playlist.m3u8"

            echo ""

            echo "HLS conversion completed."

            # -----------------------------------------------------
            # Verify playlist
            # -----------------------------------------------------

            if [ ! -f "$OUTPUT_DIR/playlist.m3u8" ]; then

              echo "ERROR: playlist.m3u8 was not created."

              exit 1

            fi

            # -----------------------------------------------------
            # Count segments
            # -----------------------------------------------------

            SEGMENT_COUNT="$(
              find "$OUTPUT_DIR" \
                -type f \
                -name "*.ts" |
              wc -l
            )"

            if [ "$SEGMENT_COUNT" -eq 0 ]; then

              echo "ERROR: No HLS segments were created."

              exit 1

            fi

            echo ""

            echo "HLS segments created: $SEGMENT_COUNT"

            # -----------------------------------------------------
            # Upload HLS to B2
            # -----------------------------------------------------

            echo ""
            echo "=================================================="
            echo "UPLOADING HLS TO B2"
            echo "=================================================="
            echo ""

            aws s3 sync \
              "$OUTPUT_DIR/" \
              "s3://${B2_BUCKET}/hls/${SAFE_NAME}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""

            echo "HLS upload completed."

            # -----------------------------------------------------
            # Update database
            # -----------------------------------------------------

            TMP_JSON="$(mktemp)"

            jq \
              --arg key "$VIDEO_KEY" \
              --arg file "$BASENAME" \
              --arg hash "$HASH" \
              --arg size "$SIZE" \
              --arg etag "$ETAG" \
              --arg folder "$SAFE_NAME" \
              --arg processed "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '.[$key] = {
                filename: $file,
                sha256: $hash,
                size: ($size | tonumber),
                etag: $etag,
                hls_folder: $folder,
                processed_at: $processed
              }' \
              processed-videos.json > "$TMP_JSON"

            mv "$TMP_JSON" processed-videos.json

            echo ""

            echo "Database updated for:"
            echo "$BASENAME"

            # -----------------------------------------------------
            # Delete temporary downloaded video
            # -----------------------------------------------------

            rm -f "$LOCAL_VIDEO"

            echo ""

            echo "Temporary video deleted."

          done < video-list.txt

         # =========================================================
      # 7. Save processed database
      # =========================================================

      - name: Save processed database
        shell: bash
        run: |

          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching latest main..."

          git fetch origin main

          # -----------------------------------------------------
          # Rebase our workflow commit on the latest remote main
          # -----------------------------------------------------

          git rebase origin/main

          # -----------------------------------------------------
          # Check whether database changed
          # -----------------------------------------------------

          if git diff --quiet HEAD~1 HEAD -- processed-videos.json; then
            echo "No processed database changes."
            exit 0
          fi

          echo "Pushing processed database..."

          git push origin HEAD:main

          echo "Database pushed successfully."