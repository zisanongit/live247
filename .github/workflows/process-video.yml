name: Process Videos to HLS

on:
  workflow_dispatch:

# Prevent two processing jobs from modifying the database
# at the same time.
concurrency:
  group: live247-video-processing
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  process-videos:

    runs-on: ubuntu-latest

    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: my-stream-run
      B2_REGION: us-east-005

      # Processing database stored in B2.
      DATABASE_KEY: processed-videos.json

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ========================================================
      # 2. INSTALL FFMPEG + JQ
      # ========================================================

      - name: Install FFmpeg and jq

        run: |

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq


      # ========================================================
      # 3. INSTALL AWS CLI
      # ========================================================

      - name: Install AWS CLI

        run: |

          python3 -m pip install --upgrade awscli


      # ========================================================
      # 4. CONFIGURE B2
      # ========================================================

      - name: Configure B2 credentials

        run: |

          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${B2_KEY_ID}
          aws_secret_access_key=${B2_APPLICATION_KEY}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${B2_REGION}
          EOF


      # ========================================================
      # 5. DOWNLOAD PROCESSING DATABASE
      # ========================================================

      - name: Prepare processing database

        shell: bash

        run: |

          set -e

          echo "========================================"
          echo "PREPARING PROCESSING DATABASE"
          echo "========================================"

          if aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$DATABASE_KEY" \
            --endpoint-url "$B2_ENDPOINT" \
            >/dev/null 2>&1
          then

            echo "Existing database found."

            aws s3 cp \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              processed-videos.json \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

          else

            echo "No existing database found."

            echo '{}' > processed-videos.json

          fi

          echo ""
          echo "Current database:"
          cat processed-videos.json


      # ========================================================
      # 6. FIND AND PROCESS VIDEOS
      # ========================================================

      - name: Scan and process videos

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p work

          echo ""
          echo "========================================"
          echo "SCANNING B2 FOR SOURCE VIDEOS"
          echo "========================================"

          # ----------------------------------------------------
          # List all B2 objects
          # ----------------------------------------------------

          aws s3api list-objects-v2 \
            --bucket "$B2_BUCKET" \
            --endpoint-url "$B2_ENDPOINT" \
            --query 'Contents[].Key' \
            --output text |
            tr '\t' '\n' |
            sed '/^None$/d' |
            sed '/^$/d' \
            > b2-files.txt

          # ----------------------------------------------------
          # Supported formats
          #
          # 3GP and FLV intentionally excluded.
          # ----------------------------------------------------

          grep -Ei \
            '(^|/)[^/]+\.(mp4|mkv|mov|avi|webm|mpeg|mpg|m4v)$' \
            b2-files.txt \
            > video-list.txt || true

          if [ ! -s video-list.txt ]; then

            echo ""
            echo "No supported source videos found."

            echo ""
            echo "This is OK if all previously processed"
            echo "source videos have already been deleted."

            exit 0

          fi

          echo ""
          echo "Source videos found:"
          cat video-list.txt


          # ====================================================
          # PROCESS EACH VIDEO
          # ====================================================

          while IFS= read -r VIDEO_KEY; do

            [ -z "$VIDEO_KEY" ] && continue

            echo ""
            echo "========================================"
            echo "SOURCE VIDEO"
            echo "$VIDEO_KEY"
            echo "========================================"


            BASENAME="$(basename "$VIDEO_KEY")"

            NAME="${BASENAME%.*}"


            # --------------------------------------------------
            # Create a unique HLS folder.
            #
            # Example:
            #
            # video2.mkv
            #
            # becomes something like:
            #
            # hls/video2-a82f17c3d921/
            #
            # This prevents different source paths from
            # accidentally sharing the same HLS folder.
            # --------------------------------------------------

            SOURCE_ID="$(
              printf '%s' "$VIDEO_KEY" |
              sha256sum |
              awk '{print $1}' |
              cut -c1-12
            )"


            SAFE_NAME="$(
              echo "$NAME" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9._-]/_/g'
            )"


            HLS_FOLDER="${SAFE_NAME}-${SOURCE_ID}"

            HLS_PREFIX="hls/${HLS_FOLDER}"

            OUTPUT_DIR="work/hls/${HLS_FOLDER}"


            echo ""
            echo "HLS folder:"
            echo "$HLS_PREFIX"


            # --------------------------------------------------
            # Get source information from B2
            # --------------------------------------------------

            OBJECT_INFO="$(
              aws s3api head-object \
                --bucket "$B2_BUCKET" \
                --key "$VIDEO_KEY" \
                --endpoint-url "$B2_ENDPOINT"
            )"


            SIZE="$(
              echo "$OBJECT_INFO" |
              jq -r '.ContentLength'
            )"


            ETAG="$(
              echo "$OBJECT_INFO" |
              jq -r '.ETag' |
              tr -d '"'
            )"


            echo ""
            echo "Source size:"
            echo "$SIZE bytes"

            echo ""
            echo "Source ETag:"
            echo "$ETAG"


            # ==================================================
            # CHECK PROCESSING DATABASE
            # ==================================================

            EXISTING_SIZE="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].size // empty' \
                processed-videos.json
            )"


            EXISTING_ETAG="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].etag // empty' \
                processed-videos.json
            )"


            EXISTING_HLS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].hls_folder // empty' \
                processed-videos.json
            )"


            EXISTING_STATUS="$(
              jq -r \
                --arg key "$VIDEO_KEY" \
                '.[$key].status // empty' \
                processed-videos.json
            )"


            # ==================================================
            # SKIP ALREADY COMPLETED VIDEO
            # ==================================================

            if [ "$EXISTING_SIZE" = "$SIZE" ] && \
               [ "$EXISTING_ETAG" = "$ETAG" ] && \
               [ "$EXISTING_STATUS" = "completed" ] && \
               [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo "========================================"
              echo "ALREADY PROCESSED"
              echo "========================================"

              echo "Video:"
              echo "$BASENAME"

              echo ""
              echo "Skipping download and conversion."

              continue

            fi


            # ==================================================
            # NEW OR CHANGED VIDEO
            # ==================================================

            echo ""
            echo "========================================"
            echo "NEW OR CHANGED VIDEO"
            echo "========================================"

            echo "$BASENAME"


            # ==================================================
            # REMOVE OLD HLS ONLY IF THIS SAME SOURCE
            # IS BEING REPROCESSED
            #
            # IMPORTANT:
            #
            # This does NOT remove HLS because a source video
            # was deleted.
            #
            # It only replaces HLS when the same source exists
            # and has changed.
            # ==================================================

            if [ -n "$EXISTING_HLS" ]; then

              echo ""
              echo "Existing HLS for changed source found:"
              echo "$EXISTING_HLS"

              echo ""
              echo "Removing ONLY old HLS for this source..."

              aws s3 rm \
                "s3://${B2_BUCKET}/${EXISTING_HLS}/" \
                --recursive \
                --endpoint-url "$B2_ENDPOINT" \
                --only-show-errors || true

            fi


            # --------------------------------------------------
            # Also clear the current generated HLS folder.
            # --------------------------------------------------

            aws s3 rm \
              "s3://${B2_BUCKET}/${HLS_PREFIX}/" \
              --recursive \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors || true


            # --------------------------------------------------
            # Prepare local output
            # --------------------------------------------------

            rm -rf "$OUTPUT_DIR"

            mkdir -p "$OUTPUT_DIR"


            # ==================================================
            # DOWNLOAD SOURCE VIDEO
            # ==================================================

            LOCAL_VIDEO="work/source-${SOURCE_ID}-${BASENAME}"

            rm -f "$LOCAL_VIDEO"


            echo ""
            echo "========================================"
            echo "DOWNLOADING SOURCE VIDEO"
            echo "========================================"

            echo "$VIDEO_KEY"


            aws s3 cp \
              "s3://${B2_BUCKET}/${VIDEO_KEY}" \
              "$LOCAL_VIDEO" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors


            echo ""
            echo "Source download completed."


            # ==================================================
            # SHA256
            # ==================================================

            HASH="$(
              sha256sum "$LOCAL_VIDEO" |
              awk '{print $1}'
            )"


            echo ""
            echo "SHA256:"
            echo "$HASH"


            # ==================================================
            # HLS CONVERSION
            # ==================================================

            echo ""
            echo "========================================"
            echo "STARTING HLS CONVERSION"
            echo "========================================"


            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -i "$LOCAL_VIDEO" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -f hls \
              -hls_time 6 \
              -hls_playlist_type vod \
              -hls_flags independent_segments \
              -hls_segment_filename \
                "$OUTPUT_DIR/segment_%05d.ts" \
              "$OUTPUT_DIR/playlist.m3u8"


            echo ""
            echo "HLS conversion completed."


            # ==================================================
            # VERIFY HLS OUTPUT
            # ==================================================

            if [ ! -f "$OUTPUT_DIR/playlist.m3u8" ]; then

              echo ""
              echo "ERROR:"
              echo "playlist.m3u8 was not generated."

              exit 1

            fi


            SEGMENT_COUNT="$(
              find "$OUTPUT_DIR" \
                -type f \
                -name "*.ts" |
              wc -l
            )"


            if [ "$SEGMENT_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR:"
              echo "No HLS .ts segments were generated."

              exit 1

            fi


            echo ""
            echo "Generated HLS segments:"
            echo "$SEGMENT_COUNT"


            # ==================================================
            # UPLOAD HLS TO B2
            # ==================================================

            echo ""
            echo "========================================"
            echo "UPLOADING HLS"
            echo "========================================"


            aws s3 sync \
              "$OUTPUT_DIR/" \
              "s3://${B2_BUCKET}/${HLS_PREFIX}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors


            echo ""
            echo "HLS upload completed."


            # ==================================================
            # UPDATE DATABASE
            # ==================================================

            TMP_JSON="$(mktemp)"


            jq \
              --arg key "$VIDEO_KEY" \
              --arg file "$BASENAME" \
              --arg hash "$HASH" \
              --arg size "$SIZE" \
              --arg etag "$ETAG" \
              --arg folder "$HLS_PREFIX" \
              --arg count "$SEGMENT_COUNT" \
              --arg processed "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '.[$key] = {
                filename: $file,
                source_key: $key,
                sha256: $hash,
                size: ($size | tonumber),
                etag: $etag,
                hls_folder: $folder,
                segment_count: ($count | tonumber),
                status: "completed",
                processed_at: $processed
              }' \
              processed-videos.json \
              > "$TMP_JSON"


            mv "$TMP_JSON" processed-videos.json


            # ==================================================
            # SAVE DATABASE TO B2
            # ==================================================

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors


            echo ""
            echo "Processing database updated."


            # ==================================================
            # CLEAN GITHUB RUNNER STORAGE
            #
            # IMPORTANT:
            #
            # This only deletes the temporary local copy
            # from GitHub Actions.
            #
            # It does NOT delete the source video from B2.
            #
            # It does NOT delete HLS from B2.
            # ==================================================

            rm -f "$LOCAL_VIDEO"

            rm -rf "$OUTPUT_DIR"


            echo ""
            echo "========================================"
            echo "VIDEO COMPLETED"
            echo "========================================"

            echo "$BASENAME"

            echo ""
            echo "HLS:"
            echo "$HLS_PREFIX"


          done < video-list.txt


      # ========================================================
      # 7. FINAL DATABASE SAVE
      # ========================================================

      - name: Save final processing database

        shell: bash

        run: |

          set -e

          if [ -f processed-videos.json ]; then

            aws s3 cp \
              processed-videos.json \
              "s3://${B2_BUCKET}/${DATABASE_KEY}" \
              --endpoint-url "$B2_ENDPOINT" \
              --content-type "application/json" \
              --only-show-errors

            echo ""
            echo "Final processing database saved."

          fi


      # ========================================================
      # 8. FINISHED
      # ========================================================

      - name: Finished

        run: |

          echo ""
          echo "========================================"
          echo "VIDEO PROCESSING COMPLETED"
          echo "========================================"
          echo ""

          echo "Already processed videos were skipped."

          echo "New or changed source videos were converted."

          echo "Each source has its own HLS folder."

          echo ""
          echo "IMPORTANT:"
          echo "Deleting a source video from B2 will NOT"
          echo "delete its HLS files."

          echo ""
          echo "HLS files remain available for streaming."
          echo ""