name: Process Videos to HLS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-videos:
    runs-on: ubuntu-latest

    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: my-stream-run

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Install FFmpeg
      # ---------------------------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      # ---------------------------------------------------------
      # 3. Install AWS CLI
      # ---------------------------------------------------------
      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade awscli

      # ---------------------------------------------------------
      # 4. Configure S3-compatible B2
      # ---------------------------------------------------------
      - name: Configure B2 credentials
        run: |
          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${B2_KEY_ID}
          aws_secret_access_key=${B2_APPLICATION_KEY}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=us-east-005
          EOF

      # ---------------------------------------------------------
      # 5. Create processed database
      # ---------------------------------------------------------
      - name: Prepare processed database
        run: |
          if [ ! -f processed-videos.json ]; then
            echo '{}' > processed-videos.json
          fi

      # ---------------------------------------------------------
      # 6. Find and process all supported videos
      # ---------------------------------------------------------
      - name: Process videos
        shell: bash
        run: |

          set -e

          VIDEO_DIR="videos"
          HLS_DIR="hls"

          mkdir -p "$HLS_DIR"

          if [ ! -d "$VIDEO_DIR" ]; then
            echo "No videos directory found."
            exit 0
          fi

          echo "Scanning videos directory..."

          find "$VIDEO_DIR" -type f \
            \( \
              -iname "*.mp4" \
              -o -iname "*.mkv" \
              -o -iname "*.mov" \
              -o -iname "*.avi" \
              -o -iname "*.webm" \
              -o -iname "*.mpeg" \
              -o -iname "*.mpg" \
              -o -iname "*.m4v" \
            \) \
            -print0 > video-list.txt

          if [ ! -s video-list.txt ]; then
            echo "No supported video files found."
            exit 0
          fi

          while IFS= read -r -d '' VIDEO; do

            echo ""
            echo "========================================"
            echo "Video: $VIDEO"
            echo "========================================"

            BASENAME="$(basename "$VIDEO")"
            NAME="${BASENAME%.*}"

            # ---------------------------------------------------
            # Sanitize folder name
            # ---------------------------------------------------
            SAFE_NAME="$(echo "$NAME" | \
              tr '[:upper:]' '[:lower:]' | \
              sed 's/[^a-z0-9._-]/_/g')"

            # ---------------------------------------------------
            # Calculate SHA-256
            # ---------------------------------------------------
            HASH="$(sha256sum "$VIDEO" | awk '{print $1}')"

            SIZE="$(stat -c%s "$VIDEO")"

            echo "Filename : $BASENAME"
            echo "Size     : $SIZE bytes"
            echo "SHA256   : $HASH"

            # ---------------------------------------------------
            # Check whether this exact video was already processed
            # ---------------------------------------------------
            EXISTING_HASH="$(jq -r \
              --arg file "$BASENAME" \
              '.[$file].sha256 // empty' \
              processed-videos.json)"

            EXISTING_SIZE="$(jq -r \
              --arg file "$BASENAME" \
              '.[$file].size // empty' \
              processed-videos.json)"

            if [ "$EXISTING_HASH" = "$HASH" ] && \
               [ "$EXISTING_SIZE" = "$SIZE" ]; then

              echo ""
              echo ">>> SKIPPING"
              echo "This exact video was already processed."
              echo ""

              continue
            fi

            echo ""
            echo ">>> NEW OR CHANGED VIDEO"
            echo "Processing: $BASENAME"
            echo ""

            # ---------------------------------------------------
            # Output directory
            # ---------------------------------------------------
            OUTPUT="$HLS_DIR/$SAFE_NAME"

            mkdir -p "$OUTPUT"

            # ---------------------------------------------------
            # Clean only this video's local output
            # ---------------------------------------------------
            rm -f "$OUTPUT"/*.ts
            rm -f "$OUTPUT"/playlist.m3u8

            # ---------------------------------------------------
            # Convert video to HLS
            #
            # Segment duration: approximately 6 seconds
            # MPEG-TS output for maximum compatibility
            # ---------------------------------------------------
            ffmpeg \
              -hide_banner \
              -loglevel warning \
              -i "$VIDEO" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -f hls \
              -hls_time 6 \
              -hls_playlist_type vod \
              -hls_flags independent_segments \
              -hls_segment_filename "$OUTPUT/segment_%05d.ts" \
              "$OUTPUT/playlist.m3u8"

            echo ""
            echo "HLS conversion completed."
            echo ""

            # ---------------------------------------------------
            # Upload this video's HLS files to B2
            # ---------------------------------------------------
            echo "Uploading HLS files to Backblaze B2..."

            aws s3 sync \
              "$OUTPUT/" \
              "s3://${B2_BUCKET}/hls/${SAFE_NAME}/" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors

            echo ""
            echo "Upload completed."

            # ---------------------------------------------------
            # Save processing information
            # ---------------------------------------------------
            TMP_JSON="$(mktemp)"

            jq \
              --arg file "$BASENAME" \
              --arg hash "$HASH" \
              --arg size "$SIZE" \
              --arg folder "$SAFE_NAME" \
              --arg processed "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '.[$file] = {
                sha256: $hash,
                size: ($size | tonumber),
                hls_folder: $folder,
                processed_at: $processed
              }' \
              processed-videos.json > "$TMP_JSON"

            mv "$TMP_JSON" processed-videos.json

            echo ""
            echo "Database updated for $BASENAME."

          done < video-list.txt

      # ---------------------------------------------------------
      # 7. Commit processing database
      # ---------------------------------------------------------
      - name: Save processed database
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add processed-videos.json

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update processed video database"
            git push
          fi

      # ---------------------------------------------------------
      # 8. Show final result
      # ---------------------------------------------------------
      - name: Finished
        run: |
          echo ""
          echo "========================================"
          echo "VIDEO PROCESSING COMPLETED"
          echo "========================================"
          echo ""
          echo "Previously processed videos were skipped."
          echo "New/changed videos were converted to HLS."
          echo ""
